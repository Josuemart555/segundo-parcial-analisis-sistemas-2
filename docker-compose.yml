services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: his_citas_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-his_citas}
      DB_USERNAME: ${DB_USERNAME:-his_user}
      DB_PASSWORD: ${DB_PASSWORD:-his_password}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - his_network

  web:
    image: nginx:1.27-alpine
    container_name: his_citas_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - his_network

  db:
    image: mysql:8.0
    container_name: his_citas_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-his_citas}
      MYSQL_USER: ${DB_USERNAME:-his_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-his_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-his_root_password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-his_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - his_network

volumes:
  db_data:
    driver: local

networks:
  his_network:
    driver: bridge
